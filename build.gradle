plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation include("xyz.nucleoid:fantasy:${fantasy_version}")
    modImplementation include("xyz.nucleoid:map-templates:${map_templates_version}")

    implementation include('javax.activation:activation:1.1.1')
    implementation include('xmlpull:xmlpull:1.1.3.1')
    implementation include('com.siemens.ct.exi:exificient:1.0.7')
    implementation include('com.siemens.ct.exi:exificient-core:1.0.7')
    implementation include('com.siemens.ct.exi:exificient-grammars:1.0.7')

    modCompileOnly 'com.terraformersmc:modmenu:15.0.0-beta.3'
    modCompileOnly 'dev.isxander:controlify:2.0.0-beta.1+26.1'
    modCompileOnly 'maven.modrinth:bobby:6.0.0'
    modCompileOnly 'maven.modrinth:iris:1.9.0+26.1'
    modCompileOnly 'maven.modrinth:e4mc:6.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    exclude 'META-INF/jars/*.jar.src.zip'
}

jar {
    from('src/main/resources') {
        include 'LICENSE_minimega'
        rename { 'LICENSE_minimega' }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
